services:
  - type: web
    name: rag-chatbot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CHAT_MODEL
        value: gemini-3.1-flash-lite
      - key: EMBEDDING_MODEL
        value: models/gemini-embedding-001
